name: starnest
description: "StarNest — Review & discover movies, games, books, gadgets and restaurants."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- UI core ---
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  flutter_screenutil: ^5.9.3

  # --- Networking ---
  dio: ^5.9.2
  connectivity_plus: ^6.0.3

  # --- Storage ---
  shared_preferences: ^2.3.3

  # --- Auth ---
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  flutter_facebook_auth: ^7.1.1
  firebase_auth: ^5.6.0
  firebase_core: ^3.13.1

  # --- Localization ---
  intl: ^0.20.2

  # --- Media ---
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  image: ^4.3.0

  # --- Misc ---
  flutter_sound: ^9.18.4
  permission_handler: ^11.4.0
  tab_container: ^3.5.3
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/icons/
    - assets/json/
    - assets/font/
    - assets/.env

  fonts:
    - family: General Sans Variable
      fonts:
        - asset: assets/font/GeneralSans-Regular.otf
          weight: 400
        - asset: assets/font/GeneralSans-Medium.otf
          weight: 500
        - asset: assets/font/GeneralSans-Semibold.otf
          weight: 600
        - asset: assets/font/GeneralSans-Bold.otf
          weight: 700
        - asset: assets/font/GeneralSans-Light.otf
          weight: 300
        - asset: assets/font/GeneralSans-Extralight.otf
          weight: 200
    # Reserved font slots — uncomment when fonts are added to assets/font/
    # - family: Maison Neue
    #   fonts:
    #     - asset: assets/font/MaisonNeue-Regular.otf
    #       weight: 400
