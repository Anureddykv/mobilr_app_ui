name: mobilr_app_ui
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get:
  shared_preferences:
  google_sign_in:
  sign_in_with_apple:
  flutter_facebook_auth:
  firebase_auth:
  firebase_core:
  intl:
  shimmer:
  image_picker:
  file_picker:
  flutter_sound:
  permission_handler:
  tab_container:
  image:
  path_provider: ^2.1.5
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  dio: ^5.9.2
  fluttertoast: ^9.0.0
  freezed_annotation: ^2.4.4
  path: ^1.9.1
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/json/
    - assets/font/

  fonts:
    - family: General Sans Variable
      fonts:
            - asset: assets/font/GeneralSans-Regular.otf
              weight: 400
            - asset: assets/font/GeneralSans-Medium.otf
              weight: 500
            - asset: assets/font/GeneralSans-Semibold.otf
              weight: 600
            - asset: assets/font/GeneralSans-Bold.otf
              weight: 700
            - asset: assets/font/GeneralSans-Light.otf
              weight: 300
            - asset: assets/font/GeneralSans-Extralight.otf
              weight: 200
